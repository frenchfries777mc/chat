<script>
(function(){

function hm(d){ d=new Date(d); var h=d.getHours(); return (h<12?'오전 ':'오후 ')+(h%12||12)+':'+pad(d.getMinutes()); }
function dayKey(d){ d=new Date(d); return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate(); }
function dayLabel(d){ d=new Date(d); var w='일월화수목금토'[d.getDay()]; return d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 '+w+'요일'; }

async function emoteNotices(){ try{ var r=await sb.rpc('ffc_emote_notices_take'); var a=(r&&r.data)||[]; if(r.error||!a.length) return;
    var nm=a.map(function(x){ return x.name; }), t=nm.length===1?'‘'+nm[0]+'’ 이모티콘이 삭제되었어요':'‘'+nm.slice(0,2).join('’, ‘')+'’'+(nm.length>2?' 외 '+(nm.length-2)+'개':'')+' 이모티콘이 삭제되었어요';

}

  app.innerHTML='<div class="side"><div class="top"><a class="home" href="https://frenchfries777.com/"><span class="fry">🍟</span><span>CHAT</span></a><span class="sp"></span><button type="button" class="inst" id="pushBtn" hidden>🔕 알림 꺼짐</button><button type="button" class="inst" id="instBtn" hidden>⬇ 앱 설치</button></div><div class="acct"><span data-ff-account data-ff-nohub></span></div>'+
   '<div class="tabs"><button data-t="chats" class="on">채팅</button><button data-t="friends">친구</button></div>'+
   '<div class="list" id="list"></div></div>'+
   '<div class="main" id="main"></div>';
  root.appendChild(app);
  [].forEach.call(app.querySelectorAll('.tabs button'),function(b){ b.onclick=function(){ tab=b.getAttribute('data-t'); [].forEach.call(app.querySelectorAll('.tabs button'),function(x){x.classList.toggle('on',x===b);}); paintList(); }; });
  paintMain();

async function loadAll(){
  await loadFriends(); await loadRooms(); paintList(); startTimers();
  var sp=new URLSearchParams(location.search), q=sp.get('room'), mg=sp.get('msg');
  if(!q&&mg&&/^\d+$/.test(mg)){ var r=await sb.from('ffc_msgs').select('room_id').eq('id',+mg).maybeSingle(); q=r&&r.data&&r.data.room_id; }
  if(q) openRoom(q);
  if(sp.has('msg')||sp.has('room')) try{ history.replaceState(null,'',location.pathname); }catch(e){}

var unames={};
function openProf(uid){ var u=unames[uid]; if(!u) return; try{ window.open('https://frenchfries777.com/profile/?u='+encodeURIComponent(u),'_blank','noopener'); }catch(e){} }
function profLink(node,uid){ if(!uid||uid===me.id||!unames[uid]) return node; node.classList.add('plink'); node.title='프로필 보기 (새 탭)'; node.onclick=function(e){ e.stopPropagation(); openProf(uid); }; return node; }
async function nameOf(ids){
  var need=ids.filter(function(i){return !names[i];}); if(!need.length) return;
  var r=await sb.from('profiles').select('id,username,display_name').in('id',need);
  ((r&&r.data)||[]).forEach(function(p){ names[p.id]=nick(p); if(p.username) unames[p.id]=p.username; });
}
async function loadFriends(){
  var r=await sb.from('friendships').select('requester_id,addressee_id,status').or('requester_id.eq.'+me.id+',addressee_id.eq.'+me.id);
  var ids=[]; ((r&&r.data)||[]).forEach(function(x){ if(x.status!=='accepted') return; var o=x.requester_id===me.id?x.addressee_id:x.requester_id; if(ids.indexOf(o)<0) ids.push(o); });
  await nameOf(ids); loadAvatars(ids);
  friends=ids.map(function(i){return {id:i,name:names[i]||'알 수 없음'};}).sort(function(a,b){return a.name.localeCompare(b.name,'ko');});
}
async function loadRooms(){

function okPx(p){ return typeof p==='string'&&p.length===1024&&/^[0-9a-f]+$/.test(p); }
function imgOk(s){ return typeof s==='string'&&s.length<=40000&&/^data:image\/png;base64,iVBORw0KGgo[A-Za-z0-9+\/=]+$/.test(s); }

  for(var i=0;i<1024;i++){ var v=parseInt(px.charAt(i),16); if(v){ c.fillStyle=EPAL[v]; c.fillRect(i%32,(i/32)|0,1,1); } }
  cv.className='pxc'; cv.style.width=size+'px'; cv.style.height=size+'px'; return cv; }

    if(n) b.title=who.map(function(x){return names[x.user_id]||'?';}).join(', ');
    b.onclick=async function(){ var r=await sb.rpc('ffc_poll_vote',{pid:id,o:i}); if(r.error){ toast(/closed/.test(r.error.message)?'끝난 투표예요':'투표하지 못했어요'); return; } loadPoll(id); };
    c.appendChild(b); });
  var st=el('div','st',(d.closed?'끝난 투표 · ':'')+total+'명 참여'+(d.multi&&!d.closed?' · 여러 개 선택 가능':'')+' · '+(names[d.user_id]||'?')+'님');
  c.appendChild(st);
  if(!d.closed&&d.user_id===me.id){ var cl=el('button','','투표 끝내기'); cl.type='button'; cl.className='pcl'; cl.onclick=async function(){ var r=await sb.rpc('ffc_poll_close',{pid:id}); if(r.error){ toast('끝내지 못했어요'); return; } loadPoll(id); }; c.appendChild(cl); }
  if(d.closed) c.classList.add('off');
  return c;
}

/* ---------- 실시간: 내기·투표 바뀜 ---------- */
function subscribeExt(ch){
  if(!V2) return ch;
  if(V3) ch=ch.on('postgres_changes',{event:'UPDATE',schema:'public',table:'ffc_msgs'},function(p){ var d=p.new; if(!d||!cur||d.room_id!==cur.id) return; var m=msgs.find(function(x){ return x.id===d.id; }); if(m){ m.kind=d.kind; m.body=d.body; m.meta=d.meta; paintMsgs(false); } })
    .on('postgres_changes',{event:'*',schema:'public',table:'ffc_reacts'},function(p){ var d=p.eventType==='DELETE'?p.old:p.new; if(!d||!cur||d.room_id!==cur.id) return; var a=reacts[d.msg_id]=(reacts[d.msg_id]||[]).filter(function(x){ return !(x.user_id===d.user_id&&x.emoji===d.emoji); }); if(p.eventType!=='DELETE') a.push(d); paintMsgs(false); })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'ffc_rooms'},function(p){ var d=p.new; if(!d) return; var rm=rooms.find(function(x){ return x.id===d.id; }); if(rm){ rm.notice=d.notice||null; rm.bg=d.bg||null; } if(cur&&cur.id===d.id){ cur.notice=d.notice||null; cur.bg=d.bg||null; paintNotice(); paintBg(); } });
  if(PL) ch=ch.on('postgres_changes',{event:'*',schema:'public',table:'ffc_poll_votes'},function(p){ var d=p.new&&p.new.poll_id?p.new:p.old; if(d&&d.poll_id&&polls[d.poll_id]) loadPoll(d.poll_id); })
         .on('postgres_changes',{event:'UPDATE',schema:'public',table:'ffc_polls'},function(p){ var d=p.new; if(d&&polls[d.id]) loadPoll(d.id); });
  return ch.on('postgres_changes',{event:'*',schema:'public',table:'ffc_bets'},function(p){ var d=p.new; if(d&&d.id){ bets[d.id]=d; nameOf([d.a,d.b]).then(function(){ if(cur&&d.room_id===cur.id) paintMsgs(false); }); } });
}

/* ===== 실시간 보강: 연결이 끊기거나 탭이 잠들었다 돌아와도 놓친 메시지를 바로 채워요 ===== */
var live=false, everLive=false, syncBusy=false, roomsAt=0;
async function syncNow(full){
  if(!me||!sb||syncBusy) return; syncBusy=true;
  try{
    if(cur){
      var rid=cur.id, last=0; msgs.forEach(function(x){ if(x.id>last) last=x.id; });
      if(last){
        var r=await sb.from('ffc_msgs').select(COLS).eq('room_id',rid).gt('id',last).order('id').limit(100);
        var rows=(r&&r.data)||[];
        if(rows.length&&cur&&cur.id===rid){ await nameOf(rows.map(function(x){return x.user_id;})); await loadReacts(rows.map(function(x){return x.id;})); rows.forEach(add); }
      }
    }
    if(full||Date.now()-roomsAt>(live?120000:30000)){
      roomsAt=Date.now(); var id=cur&&cur.id; await loadRooms();
      if(id){ var rm=rooms.find(function(x){return x.id===id;}); if(rm){ rm.unread=0; cur.members=rm.members; cur.created_by=rm.created_by; cur.notice=rm.notice; cur.bg=rm.bg; if(typeof paintHead==='function') paintHead(); } }
      paintList();
    }
  }catch(e){} finally{ syncBusy=false; }
}
var tick=0; setInterval(function(){ tick++; if(document.visibilityState!=='hidden'&&(!live||tick%8===0)) syncNow(false); }, 4000);
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible'){ syncNow(true); markRead(); } });
window.ffChatViewing=function(actor){ return !!(cur&&document.visibilityState==='visible'&&cur.members&&cur.members.indexOf(actor)>=0); };
window.addEventListener('online',function(){ syncNow(true); });
window.addEventListener('focus',function(){ syncNow(false); markRead(); });

/* ===== 앱 설치: 이 채팅만 따로 설치돼요 (설치한 앱도 사이트를 그대로 열어서 업데이트가 같이 따라와요) ===== */
var instEv=null;
function instStandalone(){ try{ return matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: minimal-ui)').matches||matchMedia('(display-mode: window-controls-overlay)').matches||navigator.standalone===true; }catch(e){ return false; } }
function instIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent); }
function instPaint(){ var b=document.getElementById('instBtn'); if(!b) return; b.hidden=instStandalone()||!(instEv||instIOS()); if(!b.__w){ b.__w=1; b.onclick=function(){
  var e=instEv; if(e){ instEv=null; e.prompt(); e.userChoice.then(function(){ instPaint(); },function(){}); return; }
  toast(instIOS()?'공유 버튼 → 홈 화면에 추가를 눌러 주세요':'브라우저 메뉴에서 앱 설치를 눌러 주세요'); }; } }
window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); instEv=e; instPaint(); });
/* 앱 스토어의 "설치"로 들어왔을 때(?ffinstall=1)만 화면 아래에 설치 줄을 보여요 */
(function(){ var want=/[?&]ffinstall=1(&|$)/.test(location.search); try{ var ft=+sessionStorage.getItem('ffInstall')||0; if(ft&&Date.now()-ft<120000) want=true; }catch(e){}
  /* 로그인 확인으로 화면이 다시 열려도 2분 동안은 설치 줄이 남아요 */
  if(!want||instStandalone()){ try{ sessionStorage.removeItem('ffInstall'); }catch(e){} return; }
  try{ history.replaceState(null,'',location.pathname+location.search.replace(/([?&])ffinstall=1(&|$)/,function(m,a,b){ return b?a:''; })+location.hash); }catch(e){}
  function bar(){ if(document.getElementById('ffInstBar')) return;
    var d=document.createElement('div'); d.id='ffInstBar'; d.style.cssText='position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:2147483000;display:flex;align-items:center;gap:10px;max-width:calc(100vw - 24px);padding:8px 10px 8px 14px;border-radius:999px;background:#171717;color:#ece6d8;border:1px solid #d9b45f;font:500 14px/1.3 system-ui,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.45)';
    var t=document.createElement('span'), b=document.createElement('button'), x=document.createElement('button');
    b.type=x.type='button'; b.textContent='⬇ 설치'; x.textContent='✕'; x.setAttribute('aria-label','close');
    b.style.cssText='border:0;border-radius:999px;padding:7px 16px;background:#d9b45f;color:#111;font:700 14px system-ui,sans-serif;cursor:pointer'; x.style.cssText='border:0;background:none;color:#a39c8c;font-size:16px;cursor:pointer;padding:4px 6px';
    b.onclick=function(){ var e=instEv; if(e){ instEv=null; e.prompt(); e.userChoice.then(function(c){ if(c&&c.outcome==='accepted'){ try{ sessionStorage.removeItem('ffInstall'); }catch(e){} d.remove(); } },function(){}); return; }
      t.textContent=instIOS()?'공유 버튼 → 홈 화면에 추가':'브라우저 메뉴(⋮) → 앱 설치'; };
    x.onclick=function(){ try{ sessionStorage.removeItem('ffInstall'); }catch(e){} d.remove(); };
    d.appendChild(t); d.appendChild(b); d.appendChild(x); document.body.appendChild(d); }
  if(document.body) bar(); else document.addEventListener('DOMContentLoaded',bar);
  window.addEventListener('appinstalled',function(){ var d=document.getElementById('ffInstBar'); if(d) d.remove(); });
})();
window.addEventListener('appinstalled',function(){ instEv=null; instPaint(); });
try{ if('serviceWorker' in navigator && /(^|\.)frenchfries777\.com$/.test(location.hostname)) navigator.serviceWorker.register('sw.js?v=3').catch(function(){}); }catch(e){}
/* 새 메시지 알림(Web Push): 위쪽 🔔 버튼으로 켜고 꺼요. 아이폰은 홈 화면에 설치한 앱에서만 돼요. */
var PUSHFN='https://kebsbuvuutilitwlvxzv.supabase.co/functions/v1/ff-chat-push', pushOn=false, pushInit=false, pushBusy=false;
function pushOk(){ return ('serviceWorker' in navigator)&&('PushManager' in window)&&('Notification' in window); }
function pushPaint(){ var b=document.getElementById('pushBtn'); if(!b) return;
  var need=instIOS()&&!instStandalone(); b.hidden=!(me&&(pushOk()||need)); var blk=!pushOn&&pushOk()&&Notification.permission==='denied', tx=pushOn?'🔔 알림 켜짐':(blk?'🚫 알림 차단됨':'🔕 알림 꺼짐'); if(b.textContent!==tx) b.textContent=tx; b.classList.toggle('on',pushOn);
  if(!b.__w){ b.__w=1; b.onclick=pushToggle; } }
function pushNote(t){ var m=document.getElementById('pushMsg'); if(!t){ if(m) m.remove(); return; } if(!m){ var tp=document.querySelector('.side .top'); if(!tp) return; m=document.createElement('div'); m.id='pushMsg'; m.style.cssText='margin:6px 12px 0;padding:8px 10px;border:1px solid var(--fry);border-radius:10px;font-size:12.5px;line-height:1.6;color:var(--tx,#ece6d8)'; tp.parentNode.insertBefore(m,tp.nextSibling); } m.textContent=t; }
function pushWait(pr,ms){ return Promise.race([pr,new Promise(function(_,rej){ setTimeout(function(){ rej(new Error('timeout')); },ms); })]); }
function pushKey(u){ var p='='.repeat((4-u.length%4)%4), r=atob((u+p).replace(/-/g,'+').replace(/_/g,'/')), a=new Uint8Array(r.length); for(var i=0;i<r.length;i++) a[i]=r.charCodeAt(i); return a; }
async function pushRead(){ try{ var reg=await navigator.serviceWorker.ready, sub=await reg.pushManager.getSubscription(); pushOn=!!sub&&Notification.permission==='granted'; if(pushOn&&me){ var r=await sb.from('ffc_push_subs').select('id').eq('endpoint',sub.endpoint).limit(1); if(!(r&&r.data&&r.data.length)) pushOn=false; } }catch(e){ pushOn=false; } pushPaint(); }
async function pushToggle(){ if(pushBusy) return;
  if(instIOS()&&!instStandalone()){ toast('공유 버튼 → 홈 화면에 추가로 설치한 뒤, 설치한 앱에서 켤 수 있어요'); pushNote('아이폰은 공유 버튼 → 홈 화면에 추가로 설치한 뒤, 설치한 앱에서 켤 수 있어요'); return; }
  if(!pushOk()){ toast('이 브라우저는 알림을 지원하지 않아요'); pushNote('이 브라우저는 알림을 지원하지 않아요. 크롬이나 엣지에서 열어 주세요'); return; }
  pushBusy=true; pushNote('');
  try{ var reg=await pushWait(navigator.serviceWorker.ready,8000), sub=await pushWait(reg.pushManager.getSubscription(),8000);
    if(pushOn){ if(sub){ var ep=sub.endpoint; await sub.unsubscribe(); await sb.from('ffc_push_subs').delete().eq('endpoint',ep); } pushOn=false; toast('알림을 껐어요'); }
    else {
      if(Notification.permission==='denied'){ toast('이 사이트의 알림이 차단돼 있어요'); pushNote('이 사이트의 알림이 차단돼 있어요. 주소창 왼쪽 아이콘(자물쇠) 클릭 → 알림을 "허용"으로 바꾸고 → 새로고침(F5) → 다시 눌러 주세요'); pushBusy=false; pushPaint(); return; }
      var perm=await Notification.requestPermission(); if(perm!=='granted'){ toast('알림이 허용되지 않았어요'); pushNote(perm==='denied'?'알림이 차단됐어요. 주소창 왼쪽 아이콘(자물쇠) 클릭 → 알림을 "허용"으로 바꾸고 → 새로고침(F5) → 다시 눌러 주세요':'알림 허용 창이 닫혔어요. 다시 누르고 "허용"을 눌러 주세요'); pushBusy=false; pushPaint(); return; }
      if(!sub){ var pk=(await pushWait(fetch(PUSHFN).then(function(r){ return r.json(); }),10000)).pub; if(!pk) throw new Error('key'); sub=await pushWait(reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:pushKey(pk)}),15000); }
      var j=sub.toJSON(); await sb.from('ffc_push_subs').delete().eq('endpoint',sub.endpoint);
      var ins=await sb.from('ffc_push_subs').insert({endpoint:sub.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth,ua:navigator.userAgent.slice(0,200)}); if(ins&&ins.error) throw ins.error;
      pushOn=true; toast('새 메시지 알림을 켰어요'); }
  }catch(e){ var why=String((e&&(e.message||e.name))||e||'').slice(0,80); toast('알림을 바꾸지 못했어요'); pushNote('알림을 바꾸지 못했어요. 잠시 뒤 다시 눌러 주세요. (이유: '+why+')'); }
  pushBusy=false; pushPaint(); }
try{ if('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message',function(e){ var d=e.data; if(d&&d.clr){ if(cur&&cur.id===d.clr&&document.visibilityState==='visible') clearNotes(); return; } if(d&&d.room&&typeof openRoom==='function') openRoom(d.room); }); }catch(e){}
setInterval(function(){ if(me&&!pushInit){ pushInit=true; pushRead(); } else pushPaint(); },1500);

setInterval(instPaint,1500);

boot();
})();
</script>
<script>
/* 설치한 채팅 앱 창에서 채팅 밖 링크를 누르면: 그 주소는 일반 브라우저 창으로 열고, 허브로 가는 링크면 채팅 창은 닫아요 */
(function(){ try{
  var app=(window.matchMedia&&(matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: window-controls-overlay)').matches))||navigator.standalone;
  if(!app) return;
  document.addEventListener('click',function(e){
    if(e.defaultPrevented||e.button||e.ctrlKey||e.metaKey||e.shiftKey) return;
    var a=e.target.closest&&e.target.closest('a[href]'); if(!a) return;
    var u; try{ u=new URL(a.href,location.href); }catch(x){ return; }
    if(!/^https?:$/.test(u.protocol)) return;
    if(u.origin===location.origin&&(/^chat\./.test(location.hostname)||/^\/chat(\/|$)/.test(u.pathname))) return;
    e.preventDefault();
    var w=null; try{ w=window.open(u.href,'_blank'); }catch(x){}
    if(!w){ location.href=u.href; return; }
    if(/^(frenchfries777\.com|frenchfries777mc\.github\.io)$/.test(u.hostname)) setTimeout(function(){ try{ window.close(); }catch(x){} },300);
  },true);
}catch(e){} })();
